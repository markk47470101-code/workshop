<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#37322b"/>
      <stop offset="1" stop-color="#13110e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#e08a63" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e08a63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8bd99"/>
      <stop offset="1" stop-color="#d5744a"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#ffe3cf"/>
    </linearGradient>
  </defs>

  <!-- фон: тёплая тёмная плитка со скруглением -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="46" y="46" width="932" height="932" rx="210" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- буква M -->
  <polyline points="250,742 250,330 512,622 774,330 774,742"
            fill="none" stroke="url(#mark)" stroke-width="96"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- искра между ножками -->
  <path d="M512 270 C523 352 555 384 632 394 C555 404 523 436 512 518 C501 436 469 404 392 394 C469 384 501 352 512 270Z"
        fill="url(#spark)"/>
</svg>
